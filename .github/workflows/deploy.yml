# サイトを公開する。ファイルを送ったとき・毎日2回（日本時間 7:10 と 19:40）・手動で動く。
# 毎回 YouTube の動画一覧を取り直してから公開するので、新しい動画は自動でのる。
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 22 * * *"   # 日本時間 7:10
    - cron: "40 10 * * *"   # 日本時間 19:40（19:00の投稿のあと）
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: 動画一覧を取り直す（失敗しても、前の一覧で公開を続ける）
        continue-on-error: true
        run: python work/fetch.py
      - name: サイトのデータを作る
        run: python work/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
